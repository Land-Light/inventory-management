<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>JAN読取テスト</title>
    <link rel="stylesheet" href="styles.css?v=20260523-2">
    <style>
      body { padding: 20px; }
      .test-shell { width: min(760px, 100%); margin: 0 auto; display: grid; gap: 18px; }
      .barcode-card { background: #fff; border: 1px solid var(--line); border-radius: 8px; padding: 18px; display: grid; gap: 14px; }
      #barcodeSvg { width: 100%; max-width: 640px; background: #fff; border: 1px solid var(--line); justify-self: center; }
      .test-actions { display: flex; flex-wrap: wrap; gap: 10px; }
      .test-video { width: min(640px, 100%); aspect-ratio: 4 / 3; background: #111; border-radius: 8px; object-fit: cover; }
      .diag { display: grid; gap: 6px; color: var(--muted); }
    </style>
  </head>
  <body>
    <main class="test-shell">
      <section class="barcode-card">
        <p class="eyebrow">Scan Test</p>
        <h1>JAN読取テスト</h1>
        <p class="lead">テスト用JAN <strong id="janText">4901234567894</strong> を表示しています。別の端末でこのページを開き、下の「カメラでテスト」を押してこのバーコードを読み取ってください。</p>
        <svg id="barcodeSvg" role="img" aria-label="JAN 4901234567894"></svg>
        <div class="test-actions">
          <button id="cameraTest" type="button">カメラでテスト</button>
          <a href="index.html" class="file-button">アプリへ戻る</a>
        </div>
        <p id="testMessage" class="notice" hidden></p>
        <p id="selfTestMessage" class="notice" hidden></p>
        <video id="testPreview" class="test-video" muted playsinline hidden></video>
        <div id="diag" class="diag"></div>
      </section>
    </main>

    <script src="https://unpkg.com/@zxing/library@0.21.3/umd/index.min.js" defer></script>
    <script>
      const TEST_JAN = "4901234567894";
      const L = {0:"0001101",1:"0011001",2:"0010011",3:"0111101",4:"0100011",5:"0110001",6:"0101111",7:"0111011",8:"0110111",9:"0001011"};
      const G = {0:"0100111",1:"0110011",2:"0011011",3:"0100001",4:"0011101",5:"0111001",6:"0000101",7:"0010001",8:"0001001",9:"0010111"};
      const R = {0:"1110010",1:"1100110",2:"1101100",3:"1000010",4:"1011100",5:"1001110",6:"1010000",7:"1000100",8:"1001000",9:"1110100"};
      const PARITY = {0:"LLLLLL",1:"LLGLGG",2:"LLGGLG",3:"LLGGGL",4:"LGLLGG",5:"LGGLLG",6:"LGGGLL",7:"LGLGLG",8:"LGLGGL",9:"LGGLGL"};
      const $ = (id) => document.getElementById(id);

      function ean13Bits(value) {
        const first = value[0];
        const left = value.slice(1, 7);
        const right = value.slice(7);
        let bits = "101";
        const parity = PARITY[first];
        for (let i = 0; i < left.length; i += 1) bits += (parity[i] === "L" ? L : G)[left[i]];
        bits += "01010";
        for (const digit of right) bits += R[digit];
        bits += "101";
        return bits;
      }

      function renderBarcode(value) {
        const svg = $("barcodeSvg");
        const bits = ean13Bits(value);
        const module = 3;
        const quiet = 12;
        const barHeight = 150;
        const textHeight = 34;
        const width = bits.length * module + quiet * 2;
        const height = barHeight + textHeight;
        svg.setAttribute("viewBox", `0 0 ${width} ${height}`);
        svg.innerHTML = `<rect width="${width}" height="${height}" fill="white"/>`;
        [...bits].forEach((bit, index) => {
          if (bit === "1") {
            const x = quiet + index * module;
            svg.insertAdjacentHTML("beforeend", `<rect x="${x}" y="8" width="${module}" height="${barHeight}" fill="black"/>`);
          }
        });
        svg.insertAdjacentHTML("beforeend", `<text x="${width / 2}" y="${height - 8}" text-anchor="middle" font-family="monospace" font-size="22" fill="black">${value}</text>`);
      }

      function drawBarcodeCanvas(value) {
        const bits = ean13Bits(value);
        const module = 4;
        const quiet = 24;
        const barHeight = 180;
        const width = bits.length * module + quiet * 2;
        const height = barHeight + 40;
        const canvas = document.createElement("canvas");
        canvas.width = width;
        canvas.height = height;
        const ctx = canvas.getContext("2d", { willReadFrequently: true });
        ctx.fillStyle = "#fff";
        ctx.fillRect(0, 0, width, height);
        ctx.fillStyle = "#000";
        [...bits].forEach((bit, index) => {
          if (bit === "1") ctx.fillRect(quiet + index * module, 8, module, barHeight);
        });
        return canvas;
      }

      function show(message) {
        const el = $("testMessage");
        el.hidden = false;
        el.textContent = message;
      }

      function diagnostics() {
        const lines = [
          `HTTPS: ${location.protocol === "https:" || location.hostname === "localhost" || location.hostname === "127.0.0.1" ? "OK" : "NG"}`,
          `BarcodeDetector: ${"BarcodeDetector" in window ? "使用可能" : "未対応"}`,
          `ZXing: ${window.ZXing?.BrowserMultiFormatReader ? "読込済み" : "未読込"}`
        ];
        $("diag").innerHTML = lines.map((line) => `<span>${line}</span>`).join("");
      }

      async function scanWithBarcodeDetector(video) {
        const detector = new BarcodeDetector({ formats: ["ean_13", "ean_8", "upc_a", "upc_e", "code_128"] });
        const startedAt = Date.now();
        while (Date.now() - startedAt < 15000) {
          const codes = await detector.detect(video);
          if (codes.length) return codes[0].rawValue;
          await new Promise((resolve) => requestAnimationFrame(resolve));
        }
        return "";
      }

      async function scanWithZxing(video) {
        const startedAt = Date.now();
        while (!window.ZXing?.BrowserMultiFormatReader && Date.now() - startedAt < 2500) {
          await new Promise((resolve) => setTimeout(resolve, 80));
        }
        if (!window.ZXing?.BrowserMultiFormatReader) return "";
        const reader = new ZXing.BrowserMultiFormatReader();
        try {
          const result = await reader.decodeOnceFromVideoDevice(undefined, video);
          return result ? result.getText() : "";
        } finally {
          reader.reset();
        }
      }

      async function runSelfTest() {
        const el = $("selfTestMessage");
        el.hidden = false;
        const startedAt = Date.now();
        while (!window.ZXing?.BrowserMultiFormatReader && Date.now() - startedAt < 3000) {
          await new Promise((resolve) => setTimeout(resolve, 80));
        }
        if (!window.ZXing?.BrowserMultiFormatReader) {
          el.textContent = "画像セルフテスト: ZXingを読み込めませんでした。";
          return;
        }
        const reader = new ZXing.BrowserMultiFormatReader();
        const canvas = drawBarcodeCanvas(TEST_JAN);
        try {
          let result = null;
          if (reader.decodeFromCanvas) result = reader.decodeFromCanvas(canvas);
          if (!result && reader.decode) result = reader.decode(canvas);
          const code = result ? result.getText() : "";
          el.textContent = code === TEST_JAN
            ? `画像セルフテスト成功: ${code}`
            : `画像セルフテスト失敗: ${code || "読取なし"}`;
        } catch (error) {
          el.textContent = `画像セルフテスト失敗: ${error.message || "読取エラー"}`;
        } finally {
          reader.reset();
        }
      }

      async function cameraTest() {
        const video = $("testPreview");
        let stream;
        try {
          if (!navigator.mediaDevices?.getUserMedia) {
            show("このブラウザではカメラを開始できません。");
            return;
          }
          video.hidden = false;
          show("カメラを起動しました。表示されているJANを大きく映してください。");
          stream = await navigator.mediaDevices.getUserMedia({ audio: false, video: { facingMode: { ideal: "environment" }, width: { ideal: 1280 }, height: { ideal: 720 }, focusMode: { ideal: "continuous" }, frameRate: { ideal: 30, max: 60 } } });
          video.srcObject = stream;
          await video.play();
          let code = "";
          if ("BarcodeDetector" in window) code = await scanWithBarcodeDetector(video);
          else code = await scanWithZxing(video);
          if (code === TEST_JAN) show(`成功: ${code} を読み取りました。`);
          else if (code) show(`別のコードを読み取りました: ${code}`);
          else show("読み取れませんでした。明るさ、距離、ピントを変えてもう一度試してください。");
        } catch (error) {
          show("カメラを開始できませんでした。ブラウザのカメラ権限を確認してください。");
        } finally {
          if (stream) stream.getTracks().forEach((track) => track.stop());
          video.hidden = true;
        }
      }

      renderBarcode(TEST_JAN);
      window.addEventListener("load", () => {
        diagnostics();
        runSelfTest();
      });
      $("cameraTest").addEventListener("click", cameraTest);
    </script>
  </body>
</html>
